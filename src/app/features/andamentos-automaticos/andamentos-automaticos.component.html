<app-processo-lista-painel
  titulo="Tela de Andamentos Automáticos"
  chave="andamentos-automaticos"
  favoritoTipo="processo-andamentos-automaticos"
  filtroFixo="tipo eq 'JUDICIAL'"
  textoPainelVazio="Selecione um processo na tabela para visualizar os andamentos automáticos dele aqui."
>
  <ng-template let-processo>
    <p>Andamentos automáticos do processo {{ processo.numeroCnj ?? processo.id }}</p>
  </ng-template>
</app-processo-lista-painel>
