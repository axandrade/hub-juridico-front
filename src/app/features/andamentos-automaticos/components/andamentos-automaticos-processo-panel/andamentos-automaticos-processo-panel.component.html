<section class="andamentos-processo-panel" aria-label="Andamentos automáticos do processo">
  <header class="andamentos-processo-panel__header">
    <h2>
      Andamentos automáticos
      <span class="andamentos-processo-panel__cnj">{{ numeroCnj() || 'sem número CNJ' }}</span>
    </h2>
    <div class="andamentos-processo-panel__tools" aria-label="Ferramentas do painel">
      <button
        type="button"
        class="andamentos-processo-panel__close"
        aria-label="Fechar painel"
        (click)="onFechar()"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <app-panel-layout-switcher [layoutPainel]="layoutPainel()" (layoutPainelChange)="escolherLayout($event)" />
    </div>
  </header>

  <nav class="andamentos-processo-panel__tabs" aria-label="Abas do painel de andamentos">
    @for (aba of abas; track aba) {
      <button type="button" [class.is-active]="abaAtiva() === aba" (click)="trocarAba(aba)">
        @switch (aba) {
          @case ('visaoGeral') {
            Visão Geral
          }
          @case ('andamentos') {
            Andamentos
            @if (novos().andamentos) {
              <span class="andamentos-processo-panel__novos">({{ novos().andamentos }} {{ novos().andamentos === 1 ? 'novo' : 'novos' }})</span>
            }
          }
          @case ('publicacoes') {
            Publicações
            @if (novos().publicacoes) {
              <span class="andamentos-processo-panel__novos">({{ novos().publicacoes }} {{ novos().publicacoes === 1 ? 'nova' : 'novas' }})</span>
            }
          }
        }
      </button>
    }
  </nav>

  <div class="andamentos-processo-panel__body">
    <app-andamentos-visao-geral
      [hidden]="abaAtiva() !== 'visaoGeral'"
      [processoId]="processoId()"
      [numeroCnj]="numeroCnj()"
      [clienteNome]="clienteNome()"
    />
    <app-andamentos-lista-andamentos [hidden]="abaAtiva() !== 'andamentos'" [processoId]="processoId()" />
    <app-andamentos-lista-publicacoes [hidden]="abaAtiva() !== 'publicacoes'" [processoId]="processoId()" />
  </div>
</section>
