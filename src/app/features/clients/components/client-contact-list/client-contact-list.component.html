<div class="clients-contact-list">
  <div class="clients-contact-list__title">
    <span>Telefones / WhatsApp</span>
    <button type="button" (click)="add()">+ Contato</button>
  </div>

  @for (group of array().controls; track group; let i = $index) {
    <div class="clients-contact-list__line clients-contact-list__line--typed" [formGroup]="group">
      <button
        type="button"
        class="clients-primary-toggle"
        [class.is-active]="group.controls.principal.value"
        [attr.aria-label]="
          group.controls.principal.value ? 'Contato principal' : 'Definir como principal'
        "
        (click)="makePrimary(i)"
      >
        <i class="fa-solid fa-star" aria-hidden="true"></i>
      </button>
      <input type="tel" formControlName="valor" placeholder="(00) 00000-0000" />
      <select formControlName="tipo">
        @for (type of contactTypes; track type) {
          <option [value]="type">{{ typeLabel(type) }}</option>
        }
      </select>
      <button
        type="button"
        class="clients-icon-button"
        aria-label="Remover contato"
        (click)="remove(i)"
      >
        <i class="fa-solid fa-minus" aria-hidden="true"></i>
      </button>
    </div>
  } @empty {
    <p class="clients-contact-list__empty">Nenhum contato cadastrado.</p>
  }
</div>
