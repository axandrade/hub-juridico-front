<div class="clients-representatives">
  <div class="clients-contact-list__title">
    <span>Representantes legais</span>
    <button type="button" (click)="openNew()">Adicionar representante</button>
  </div>

  @for (group of array().controls; track group) {
    @let rep = group.getRawValue();
    @let juridica = rep.tipo === 'JURIDICA';
    <div class="clients-representative-row">
      <button type="button" class="clients-representative-row__info" (click)="openEdit($index)">
        <strong>
          {{ (juridica ? rep.razaoSocial : rep.nome) || 'Representante sem nome' }}
        </strong>
        <span>
          {{ (juridica ? rep.cnpj : rep.cpf) || 'Documento não informado' }}
          @if (rep.cargo) {
            · {{ rep.cargo }}
          }
        </span>
      </button>
      <button
        type="button"
        class="clients-icon-button"
        aria-label="Remover representante"
        (click)="remove($index)"
      >
        <i class="fa-solid fa-trash" aria-hidden="true"></i>
      </button>
    </div>
  } @empty {
    <p class="clients-contact-list__empty">Nenhum representante cadastrado.</p>
  }
</div>

@if (editing(); as current) {
  <app-client-representative-dialog
    [value]="current.value"
    (saved)="onSaved($event)"
    (closed)="closeDialog()"
  />
}
