<app-modal
  [open]="open()"
  title="Enviar arquivo"
  [dismissable]="!sending() && !salvandoTipo()"
  (closed)="close()"
>
  <div class="file-upload" (click)="onClickNoDialogo($event)">
    <div class="file-upload__field">
      <span>Tipo do anexo</span>

      @switch (modoTipo()) {
        @case ('idle') {
          <div class="file-upload__tipo-row">
            <select
              class="file-upload__select"
              [value]="tipoId()"
              [disabled]="!tipos().length"
              (change)="setTipo($event)"
            >
              @for (option of tipos(); track option.id) {
                <option [value]="option.id" [selected]="option.id === tipoId()">
                  {{ option.nome }}
                </option>
              }
              @empty {
                <option [value]="null">Nenhum tipo cadastrado</option>
              }
            </select>

            <div class="file-upload__tipo-menu">
              <button
                type="button"
                class="file-upload__tipo-btn"
                title="Gerenciar tipos"
                aria-label="Gerenciar tipos"
                [class.is-active]="menuTipoAberto()"
                (click)="toggleMenuTipo()"
              >
                <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
              </button>

              @if (menuTipoAberto()) {
                <div class="file-upload__tipo-dropdown" role="menu">
                  <button type="button" (click)="iniciarAddTipo()">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i> Adicionar
                  </button>
                  <button type="button" [disabled]="tipoId() === null" (click)="iniciarEditTipo()">
                    <i class="fa-solid fa-pen" aria-hidden="true"></i> Editar
                  </button>
                  <button type="button" [disabled]="tipoId() === null" (click)="iniciarDeleteTipo()">
                    <i class="fa-solid fa-trash" aria-hidden="true"></i> Excluir
                  </button>
                </div>
              }
            </div>
          </div>
        }

        @case ('confirmDelete') {
          <div class="file-upload__tipo-row file-upload__tipo-row--confirm">
            <span class="file-upload__tipo-confirm-text">
              Excluir o tipo "{{ nomeTipoSelecionado() }}"?
            </span>
            <button
              type="button"
              class="file-upload__tipo-btn file-upload__tipo-btn--danger"
              title="Confirmar exclusão"
              [disabled]="salvandoTipo()"
              (click)="confirmarDeleteTipo()"
            >
              <i class="fa-solid fa-check" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="file-upload__tipo-btn"
              title="Cancelar"
              [disabled]="salvandoTipo()"
              (click)="cancelarTipo()"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
        }

        @default {
          <div class="file-upload__tipo-row">
            <input
              class="file-upload__select"
              type="text"
              maxlength="60"
              [value]="rascunhoTipo()"
              [placeholder]="modoTipo() === 'add' ? 'Novo tipo...' : 'Nome do tipo'"
              (input)="atualizarRascunho($event)"
              (keydown.enter)="confirmarTipo()"
              (keydown.escape)="cancelarTipo()"
            />
            <button
              type="button"
              class="file-upload__tipo-btn"
              title="Confirmar"
              [disabled]="!rascunhoTipo().trim() || salvandoTipo()"
              (click)="confirmarTipo()"
            >
              <i class="fa-solid fa-check" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="file-upload__tipo-btn"
              title="Cancelar"
              [disabled]="salvandoTipo()"
              (click)="cancelarTipo()"
            >
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
        }
      }

      @if (erroTipo()) {
        <span class="file-upload__tipo-erro">{{ erroTipo() }}</span>
      }
    </div>

    <div class="file-upload__field">
      <span>Arquivo</span>
      <label
        class="file-upload__drop"
        [class.is-dragging]="dragging()"
        [class.has-file]="!!file()"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
      >
        <input type="file" (change)="pickFile($event)" aria-label="Escolher arquivo" />
        <i
          [class]="file() ? 'fa-solid fa-file-lines' : 'fa-solid fa-paperclip'"
          aria-hidden="true"
        ></i>
        <span class="file-upload__drop-text">
          {{ file()?.name || 'Clique ou arraste um arquivo aqui' }}
        </span>
      </label>
    </div>
  </div>

  <ng-container modalFooter>
    <app-button
      variant="tertiary"
      label="Cancelar"
      [disabled]="sending() || salvandoTipo()"
      (clicked)="close()"
    />
    <app-button
      variant="primary"
      [label]="sending() ? 'Enviando...' : 'Enviar'"
      [disabled]="!file() || tipoId() === null || sending() || modoTipo() !== 'idle'"
      (clicked)="submit()"
    />
  </ng-container>
</app-modal>
