<section class="operacao-form" aria-label="Cadastro de operação">
  <div class="operacao-form__processo-badge">
    <i class="fa-solid fa-scale-balanced" aria-hidden="true"></i>
    <span class="operacao-form__processo-label">Processo</span>
    <span class="operacao-form__processo-cnj">{{ numeroCnj() || 'sem número CNJ' }}</span>
  </div>

  <nav class="operacao-form__tabs" aria-label="Abas da operação">
    @for (aba of abas; track aba) {
      <button type="button" [class.is-active]="abaAtiva() === aba" (click)="trocarAba(aba)">
        @switch (aba) {
          @case ('informacoesGerais') {
            Informações gerais
          }
          @case ('checklists') {
            Checklists
          }
          @case ('comentarios') {
            Comentários
          }
          @case ('historico') {
            Histórico
          }
        }
      </button>
    }
  </nav>

  <div class="operacao-form__conteudo">
    <app-operacao-informacoes-gerais [hidden]="abaAtiva() !== 'informacoesGerais'" />
    <app-operacao-checklists [hidden]="abaAtiva() !== 'checklists'" [operacaoId]="entityId()" />
    <app-operacao-comentarios [hidden]="abaAtiva() !== 'comentarios'" [operacaoId]="entityId()" />
    <app-operacao-historico [hidden]="abaAtiva() !== 'historico'" [operacaoId]="entityId()" />
  </div>

  <footer class="operacao-form__acoes">
    <app-button variant="tertiary" size="sm" label="Cancelar" (clicked)="cancelar()" />
    <app-button
      variant="primary"
      size="sm"
      icon="fa-solid fa-floppy-disk"
      [label]="salvando() ? 'Salvando...' : 'Salvar'"
      [disabled]="salvando()"
      (clicked)="salvar()"
    />
  </footer>
</section>
