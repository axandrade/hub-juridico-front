<section class="operacoes-processo-panel" aria-label="Operações do processo">
  <header class="operacoes-processo-panel__header">
    <h2>
      Operações
      <span class="operacoes-processo-panel__cnj">{{ numeroCnj() || 'sem número CNJ' }}</span>
    </h2>
    <div class="operacoes-processo-panel__tools" aria-label="Ferramentas do painel">
      <button
        type="button"
        class="operacoes-processo-panel__close"
        aria-label="Fechar painel"
        (click)="onFechar()"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <app-panel-layout-switcher [layoutPainel]="layoutPainel()" (layoutPainelChange)="escolherLayout($event)" />
    </div>
  </header>

  <div class="operacoes-processo-panel__acoes">
    <app-button
      variant="primary"
      size="sm"
      icon="fa-solid fa-circle-plus"
      label="Novo"
      (clicked)="abrirNovo()"
    />
  </div>

  <div class="operacoes-processo-panel__table-wrap">
    <app-domain-model-table
      entityName="operacao"
      fields="id,tipo,titulo,providencia,prazoFatal,status,criadoEm,processoId"
      [columns]="colunas"
      [columnsToolbar]="false"
      [filter]="filtro()"
      [size]="200"
      sort="-criadoEm"
      trackKey="id"
      emptyMessage="Nenhuma operação cadastrada para este processo."
      [sortable]="true"
      [favoritable]="false"
      [deleteAction]="excluirOperacao"
      deleteAriaLabel="Excluir operação"
      (dataLoaded)="onDataLoaded($event)"
      (rowClick)="abrirEdicao($event)"
    />
  </div>
</section>

<app-modal [open]="formAberto() !== null" [wide]="true" [title]="tituloForm()" (closed)="fecharForm()">
  @if (formAberto() !== null) {
    <app-operacao-form
      [processoId]="processoId()"
      [operacaoId]="operacaoIdParaForm()"
      (salvo)="onOperacaoSalva()"
      (cancelado)="fecharForm()"
    />
  }
</app-modal>
