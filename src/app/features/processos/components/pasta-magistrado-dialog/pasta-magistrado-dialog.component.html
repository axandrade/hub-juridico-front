@if (pastaMagistrado.aberto()) {
  @if (pastaMagistrado.magistrado(); as alvo) {
    <app-modal
      [open]="true"
      [large]="true"
      [title]="
        pastaExplorerProcesso()
          ? 'Pasta — ' + (alvo.nome || 'magistrado') + ' · ' + pastaExplorerProcesso()!.numeroProcesso
          : 'Pasta — ' + (alvo.nome || 'magistrado')
      "
      (closed)="fechar()"
    >
      @if (pastaExplorerProcesso(); as processo) {
        <button type="button" class="pasta-dialog__voltar" (click)="voltarParaListaPastas()">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Todos os processos
        </button>
        <app-document-explorer
          [pessoaId]="alvo.id"
          [pessoaNome]="alvo.nome"
          [pastaInicialId]="processo.pastaId"
          (notify)="onPastaNotice($event)"
        />
      } @else {
        <app-processos-magistrado-com-arquivos
          [magistradoId]="alvo.id"
          [recarregarTick]="pastaResumoTick()"
          (rowOpen)="abrirPastaDoResumo($event)"
        />
      }
      @if (pastaNotice()) {
        <p class="pasta-dialog__notice">{{ pastaNotice() }}</p>
      }
    </app-modal>
  }
}
