<div class="processo-form__row">
  <div class="processo-field">
    <span>Cliente</span>
    <app-domain-model-dropdown
      ariaLabel="Cliente do processo"
      placeholder="Buscar pessoa..."
      emptyLabel="— Sem cliente —"
      noResultsText="Nenhuma pessoa encontrada"
      itemNoun="pessoa"
      entityName="pessoa"
      fields="id,nome,razaoSocial,nomeFantasia"
      [searchFields]="['nome', 'razaoSocial', 'nomeFantasia']"
      [displayFormatter]="rotuloPessoaFormatter"
      [value]="clienteValor()"
      [valueLabel]="clienteAtual()?.nome ?? ''"
      (itemSelected)="onClienteSelected($event)"
    />
  </div>
  <div class="processo-field">
    <span>Posição</span>
    <app-domain-model-dropdown
      ariaLabel="Posição do cliente"
      placeholder="Buscar posição..."
      emptyLabel="— Sem posição —"
      noResultsText="Nenhuma posição encontrada"
      itemNoun="posição"
      entityName="posicao-cliente"
      fields="id,nome"
      [searchFields]="['nome']"
      sort="nome"
      [displayFormatter]="rotuloCatalogo"
      [value]="posicaoValor()"
      [valueLabel]="posicaoAtual()?.nome ?? ''"
      [adicionar]="true"
      (itemSelected)="onPosicaoSelected($event)"
      (aoAdicionar)="criarPosicao($event)"
    />
  </div>
</div>

<div class="processo-clientes__acoes">
  <button type="button" class="processo-clientes__botao" (click)="adicionar()">
    <i class="fa-solid fa-plus" aria-hidden="true"></i> Adicionar
  </button>
  <button
    type="button"
    class="processo-clientes__botao"
    [disabled]="selecionado() < 0"
    (click)="remover()"
  >
    <i class="fa-solid fa-trash-can" aria-hidden="true"></i> Remover
  </button>
</div>

<ul class="processo-clientes__lista" role="listbox" aria-label="Clientes do processo">
  @for (linha of linhas(); track linha.pessoaId; let i = $index) {
    <li class="processo-clientes__linha">
      <button
        type="button"
        class="clients-primary-toggle"
        [class.is-active]="linha.principal"
        [attr.aria-label]="linha.principal ? 'Cliente principal' : 'Definir como principal'"
        (click)="marcarPrincipal(i)"
      >
        <!-- Sem equivalente no Font Awesome Free — path da fa-star (mesmo viewBox 576x512) com o
             path da fa-user centralizado por cima, pra manter a proporção exata da estrela do FA. -->
        <svg class="processo-clientes__estrela" viewBox="0 0 576 512" aria-hidden="true">
          <path
            fill="currentColor"
            d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z"
          />
          <g transform="translate(149 95) scale(0.62)">
            <path
              fill="#fff"
              d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512l388.6 0c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304l-91.4 0z"
            />
          </g>
        </svg>
      </button>
      <button
        type="button"
        class="processo-clientes__opcao"
        role="option"
        [attr.aria-selected]="selecionado() === i"
        [class.is-selected]="selecionado() === i"
        (click)="selecionar(i)"
      >
        <span class="processo-clientes__nome" [title]="linha.pessoaNome">{{ linha.pessoaNome || '—' }}</span>
        <span class="processo-clientes__posicao">{{ linha.posicaoNome || '—' }}</span>
      </button>
      <button
        type="button"
        class="processo-clientes__pasta"
        title="Pasta de arquivos do cliente"
        [attr.aria-label]="'Pasta de arquivos de ' + linha.pessoaNome"
        (click)="abrirPasta(linha)"
      >
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
      </button>
    </li>
  } @empty {
    <li class="processo-clientes__vazio">Nenhum cliente adicionado.</li>
  }
</ul>
