<header class="header">
  <div class="header__title">
    <h1>{{ pageTitle() }}</h1>
    <small>{{ pageSubtitle() }}</small>
  </div>

  <div class="header__actions">
    @for (action of quickActions; track action.label) {
      <app-button
        [variant]="action.variant"
        size="sm"
        [icon]="action.icon"
        [label]="action.label"
      />
    }
    <app-button
      variant="tertiary"
      size="sm"
      icon="fa-solid fa-folder"
      label="Abrir pasta do cliente"
      [disabled]="!temClienteSelecionado()"
      (clicked)="abrirPastaCliente()"
    />
  </div>

  <div class="header__context">
    <div>
      <span class="header__context-label">Contexto</span>
      <strong>{{ context.contextLabel }}</strong>
    </div>
    <div class="header__user">
      <i class="fa-solid fa-circle-user" aria-hidden="true"></i>
      <span>{{ userName() }}</span>
      @if (userRole()) {
        <small class="header__user-role">{{ userRole() }}</small>
      }
    </div>
  </div>
</header>
